[package]
name = "evmole"
version = "0.9.4"
edition = "2024"
description = "Analyzes deployed EVM bytecode: extracts function selectors and CBOR metadata; infers argument types, state mutability, storage layouts, and control flow."
keywords = ["evm", "ethereum", "bytecode", "abi", "static-analysis"]
authors = ["Maxim Andreev <andreevmaxim@gmail.com>"]
license = "MIT"
homepage = "https://evmole.xyz/"
repository = "https://github.com/cdump/evmole"
exclude = ["/javascript", "/python", "/benchmark", "/.github", "/agent", "/go"]

[dependencies]
alloy-primitives = { version = "1", default-features = false, features = ["std"] }
alloy-dyn-abi = { version = "1", default-features = false }
foldhash = "0.2"
indexmap = "2.12"
minicbor = { version = "2.2", default-features = false, features = ["alloc"] }

pyo3 = { version = "0.28", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
serde = ["dep:serde"]
python = ["dep:pyo3"]
javascript = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "serde"]
wasm = ["serde", "dep:serde_json"]

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]
